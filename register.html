<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Al Barakah - Register</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 15% 20%,#14517a35,transparent 35%),
        radial-gradient(circle at 85% 80%,#087d7430,transparent 35%),
        #07111f;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 15px;
}

.wrapper{
    width:100%;
    max-width:440px;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo-icon{
    width:62px;
    height:62px;
    margin:0 auto 12px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#08a88e,#19d6b5);
    font-size:30px;
    box-shadow:0 8px 25px #00b89445;
}

.logo h1{
    margin:0;
    font-size:25px;
    letter-spacing:.5px;
}

.logo p{
    margin:7px 0 0;
    color:#8fa4b9;
    font-size:13px;
}

.card{
    background:linear-gradient(145deg,#10263c,#0b1726);
    border:1px solid #ffffff12;
    border-radius:24px;
    padding:30px 25px;
    box-shadow:0 20px 55px #0008;
}

.card h2{
    margin:0 0 7px;
    text-align:center;
    font-size:25px;
}

.subtitle{
    text-align:center;
    color:#8fa4b9;
    font-size:13px;
    margin-bottom:25px;
}

.field{
    margin-bottom:16px;
}

label{
    display:block;
    color:#c7d6e4;
    font-size:13px;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px 14px;
    border-radius:11px;
    border:1px solid #ffffff15;
    outline:none;
    background:#071522;
    color:#fff;
    font-size:14px;
}

input::placeholder{
    color:#61758a;
}

input:focus{
    border-color:#20d6b4;
    box-shadow:0 0 0 3px #20d6b415;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:55px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:0;
    color:#7f95aa;
    cursor:pointer;
    font-size:12px;
}

.ref-box{
    background:#20d6b408;
    border:1px solid #20d6b420;
    padding:12px;
    border-radius:11px;
    margin-bottom:16px;
}

.ref-box strong{
    color:#20d6b4;
}

.ref-box span{
    color:#8fa4b9;
    font-size:12px;
}

.terms{
    display:flex;
    gap:8px;
    align-items:flex-start;
    margin:18px 0;
    color:#8fa4b9;
    font-size:12px;
    line-height:1.5;
}

.terms input{
    width:auto;
    margin-top:3px;
    accent-color:#19d6b5;
}

.register-btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    background:linear-gradient(135deg,#08a88e,#19d6b5);
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 22px #00b89435;
}

.register-btn:hover{
    filter:brightness(1.08);
}

.register-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#message{
    text-align:center;
    margin-top:15px;
    font-size:13px;
    font-weight:600;
    min-height:18px;
}

.login{
    text-align:center;
    margin-top:20px;
    color:#8fa4b9;
    font-size:13px;
}

.login a{
    color:#20d6b4;
    text-decoration:none;
    font-weight:700;
}

.login a:hover{
    text-decoration:underline;
}

.footer{
    text-align:center;
    color:#5f7488;
    font-size:11px;
    margin-top:20px;
}

@media(max-width:480px){

    body{
        padding:18px 12px;
    }

    .card{
        padding:25px 18px;
        border-radius:20px;
    }

    .logo h1{
        font-size:23px;
    }

}

</style>

</head>

<body>

<div class="wrapper">

    <div class="logo">

        <div class="logo-icon">
            🕌
        </div>

        <h1>
            AL BARAKAH
        </h1>

        <p>
            Create your account
        </p>

    </div>


    <div class="card">

        <h2>
            Create Account
        </h2>

        <div class="subtitle">
            Enter your details to get started
        </div>


        <form id="registerForm">

            <div class="field">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>

            </div>


            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>


            <div class="field">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="03XXXXXXXXX"
                    maxlength="11"
                    autocomplete="tel"
                    required>

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('password',this)">

                        Show

                    </button>

                </div>

            </div>


            <div class="field">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword',this)">

                        Show

                    </button>

                </div>

            </div>


            <div
                class="ref-box"
                id="refBox"
                style="display:none;">

                <span>
                    Referral Code:
                </span>

                <strong id="refCode">
                    -
                </strong>

            </div>


            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required>

                <span>
                    I agree to the terms and conditions.
                </span>

            </label>


            <button
                type="submit"
                class="register-btn"
                id="registerBtn">

                Create Account

            </button>


            <div id="message"></div>

        </form>


        <div class="login">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <div class="footer">
        © 2026 Al Barakah
    </div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
    getDatabase,
    ref,
    set,
    get
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


/* =========================
   AL BARAKAH FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCCFvbttq5fFFXMVdkVM4ddolUFoGTDV0k",

    authDomain:
        "al-barakah-d5e8a.firebaseapp.com",

    databaseURL:
        "https://al-barakah-d5e8a-default-rtdb.firebaseio.com",

    projectId:
        "al-barakah-d5e8a",

    storageBucket:
        "al-barakah-d5e8a.firebasestorage.app",

    messagingSenderId:
        "132271131466",

    appId:
        "1:132271131466:web:d5819ed98b681d14238fb3",

    measurementId:
        "G-95Y27E3DWM"

};


/* =========================
   INITIALIZE
========================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


/* =========================
   ELEMENTS
========================= */

const form =
    document.getElementById(
        "registerForm"
    );

const message =
    document.getElementById(
        "message"
    );

const registerBtn =
    document.getElementById(
        "registerBtn"
    );


/* =========================
   REFERRAL FROM URL
   Example:
   register.html?ref=ABK123456
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const incomingReferral =
    (params.get("ref") || "")
    .trim()
    .toUpperCase();


if(incomingReferral){

    document.getElementById(
        "refCode"
    ).innerText =
        incomingReferral;

    document.getElementById(
        "refBox"
    ).style.display =
        "block";

}


/* =========================
   GENERATE REFERRAL CODE
========================= */

function generateReferralCode(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code =
        "ABK";

    for(let i = 0; i < 6; i++){

        code +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }

    return code;

}


/* =========================
   FIND UNIQUE CODE
========================= */

async function createUniqueCode(){

    const usersRef =
        ref(db,"users");

    const snapshot =
        await get(usersRef);

    const users =
        snapshot.exists()
            ? snapshot.val()
            : {};

    let code;
    let exists;

    do{

        code =
            generateReferralCode();

        exists =
            Object.values(users)
            .some(
                user =>
                    user &&
                    user.referralCode === code
            );

    }while(exists);

    return code;

}


/* =========================
   CHECK REFERRAL
========================= */

async function findReferrer(code){

    if(!code){
        return null;
    }

    const snapshot =
        await get(
            ref(db,"users")
        );

    if(!snapshot.exists()){
        return null;
    }

    const users =
        snapshot.val();

    for(const uid in users){

        if(
            users[uid] &&
            users[uid].referralCode === code
        ){

            return uid;

        }

    }

    return null;

}


/* =========================
   REGISTER
========================= */

form.addEventListener(
    "submit",
    async(event)=>{

        event.preventDefault();

        const name =
            document
            .getElementById("name")
            .value
            .trim();

        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const phone =
            document
            .getElementById("phone")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;

        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        /* PASSWORD */

        if(password !== confirmPassword){

            showMessage(
                "Passwords do not match.",
                true
            );

            return;

        }


        if(password.length < 6){

            showMessage(
                "Password must be at least 6 characters.",
                true
            );

            return;

        }


        /* PHONE */

        if(!/^03[0-9]{9}$/.test(phone)){

            showMessage(
                "Enter a valid phone number, e.g. 03XXXXXXXXX.",
                true
            );

            return;

        }


        registerBtn.disabled =
            true;

        registerBtn.innerText =
            "Creating Account...";


        try{

            /*
             * Create Firebase Authentication
             * account first.
             */

            const credential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            const user =
                credential.user;


            /*
             * Save display name.
             */

            await updateProfile(
                user,
                {
                    displayName:
                        name
                }
            );


            /*
             * Create personal referral code.
             */

            const myReferralCode =
                generateReferralCode();


            /*
             * If a referral code was supplied,
             * try to find its owner.
             */

            let referredBy = null;

            if(incomingReferral){

                try{

                    referredBy =
                        await findReferrer(
                            incomingReferral
                        );

                }catch(refError){

                    console.warn(
                        "Referral lookup skipped:",
                        refError
                    );

                }

            }


            /*
             * Save user profile.
             */

            await set(
                ref(
                    db,
                    "users/" + user.uid
                ),
                {

                    uid:
                        user.uid,

                    name:
                        name,

                    email:
                        email,

                    phone:
                        phone,

                    referralCode:
                        myReferralCode,

                    referredBy:
                        referredBy,

                    wallet:
                        0,

                    status:
                        "active",

                    createdAt:
                        Date.now()

                }
            );


            showMessage(
                "Account created successfully.",
                false
            );


            registerBtn.innerText =
                "Account Created ✓";


            setTimeout(()=>{

                window.location.href =
                    "dashboard.html";

            },1000);


        }catch(error){

            console.error(
                "Registration error:",
                error
            );


            let errorText =
                "Registration failed. Please try again.";


            switch(error.code){

                case "auth/email-already-in-use":

                    errorText =
                        "This email is already registered.";

                    break;


                case "auth/invalid-email":

                    errorText =
                        "Please enter a valid email address.";

                    break;


                case "auth/weak-password":

                    errorText =
                        "Password must be at least 6 characters.";

                    break;


                case "auth/network-request-failed":

                    errorText =
                        "Network error. Check your internet connection.";

                    break;


                case "auth/operation-not-allowed":

                    errorText =
                        "Email/Password login is not enabled in Firebase.";

                    break;


                case "PERMISSION_DENIED":

                    errorText =
                        "Database permission denied. Check Firebase Rules.";

                    break;

            }


            showMessage(
                errorText,
                true
            );


            registerBtn.disabled =
                false;

            registerBtn.innerText =
                "Create Account";

        }

    }
);


/* =========================
   PASSWORD SHOW/HIDE
========================= */

window.togglePassword =
function(id,button){

    const input =
        document.getElementById(id);


    if(input.type === "password"){

        input.type =
            "text";

        button.innerText =
            "Hide";

    }else{

        input.type =
            "password";

        button.innerText =
            "Show";

    }

};


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    isError
){

    message.innerText =
        text;

    message.style.color =
        isError
            ? "#ff6b6b"
            : "#20d6b4";

}

</script>

</body>
</html>
