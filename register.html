```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Al Barakah - Register</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 15% 20%,#14517a35,transparent 35%),
        radial-gradient(circle at 85% 80%,#087d7430,transparent 35%),
        #07111f;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 15px;
}

/* MAIN */

.wrapper{
    width:100%;
    max-width:440px;
}

/* LOGO */

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo-icon{
    width:62px;
    height:62px;
    margin:0 auto 12px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#08a88e,#19d6b5);
    font-size:30px;
    box-shadow:0 8px 25px #00b89445;
}

.logo h1{
    margin:0;
    font-size:25px;
    letter-spacing:.5px;
}

.logo p{
    margin:7px 0 0;
    color:#8fa4b9;
    font-size:13px;
}

/* CARD */

.card{
    background:linear-gradient(145deg,#10263c,#0b1726);
    border:1px solid #ffffff12;
    border-radius:24px;
    padding:30px 25px;
    box-shadow:0 20px 55px #0008;
}

.card h2{
    margin:0 0 7px;
    text-align:center;
    font-size:25px;
}

.subtitle{
    text-align:center;
    color:#8fa4b9;
    font-size:13px;
    margin-bottom:25px;
}

/* INPUT */

.field{
    margin-bottom:16px;
}

label{
    display:block;
    color:#c7d6e4;
    font-size:13px;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px 14px;
    border-radius:11px;
    border:1px solid #ffffff15;
    outline:none;
    background:#071522;
    color:#fff;
    font-size:14px;
}

input::placeholder{
    color:#61758a;
}

input:focus{
    border-color:#20d6b4;
    box-shadow:0 0 0 3px #20d6b415;
}

/* PASSWORD */

.password-box{
    position:relative;
}

.password-box input{
    padding-right:55px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:0;
    color:#7f95aa;
    cursor:pointer;
    font-size:12px;
}

/* TERMS */

.terms{
    display:flex;
    gap:8px;
    align-items:flex-start;
    margin:18px 0;
    color:#8fa4b9;
    font-size:12px;
    line-height:1.5;
}

.terms input{
    width:auto;
    margin-top:3px;
    accent-color:#19d6b5;
}

/* BUTTON */

.register-btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    background:linear-gradient(135deg,#08a88e,#19d6b5);
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 22px #00b89435;
}

.register-btn:hover{
    filter:brightness(1.08);
}

/* MESSAGE */

#message{
    text-align:center;
    margin-top:15px;
    font-size:13px;
    font-weight:600;
    min-height:18px;
}

/* LOGIN */

.login{
    text-align:center;
    margin-top:20px;
    color:#8fa4b9;
    font-size:13px;
}

.login a{
    color:#20d6b4;
    text-decoration:none;
    font-weight:700;
}

.login a:hover{
    text-decoration:underline;
}

/* FOOTER */

.footer{
    text-align:center;
    color:#5f7488;
    font-size:11px;
    margin-top:20px;
}

/* MOBILE */

@media(max-width:480px){

    body{
        padding:18px 12px;
    }

    .card{
        padding:25px 18px;
        border-radius:20px;
    }

    .logo h1{
        font-size:23px;
    }

}

</style>

</head>

<body>


<div class="wrapper">


    <!-- LOGO -->

    <div class="logo">

        <div class="logo-icon">
            🕌
        </div>

        <h1>
            AL BARAKAH
        </h1>

        <p>
            Create your account
        </p>

    </div>


    <!-- REGISTER CARD -->

    <div class="card">

        <h2>
            Create Account
        </h2>

        <div class="subtitle">
            Enter your details to get started
        </div>


        <form id="registerForm">


            <div class="field">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="field">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="03XXXXXXXXX"
                    required>

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('password',this)">
                        Show
                    </button>

                </div>

            </div>


            <div class="field">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword',this)">
                        Show
                    </button>

                </div>

            </div>


            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required>

                <span>
                    I agree to the terms and conditions.
                </span>

            </label>


            <button
                type="submit"
                class="register-btn"
                id="registerBtn">

                Create Account

            </button>


            <div id="message"></div>


        </form>


        <div class="login">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <div class="footer">
        © 2026 Al Barakah
    </div>


</div>


<script type="module">

/*
   Firebase Authentication will be connected
   after the Firebase project is configured.
*/

const form =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");

form.addEventListener("submit",(e)=>{

    e.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if(password !== confirmPassword){

        message.style.color="#ff6b6b";

        message.innerText =
            "Passwords do not match.";

        return;

    }


    if(password.length < 6){

        message.style.color="#ff6b6b";

        message.innerText =
            "Password must be at least 6 characters.";

        return;

    }


    /*
       Temporary frontend validation.
       Firebase registration will be connected
       in the next step.
    */

    message.style.color="#20d6b4";

    message.innerText =
        "Account details are ready.";

});


window.togglePassword =
function(id,button){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

        button.innerText = "Hide";

    }else{

        input.type = "password";

        button.innerText = "Show";

    }

};

</script>


</body>
</html>
```
