```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Al Barakah - Login</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 15% 20%,#14517a35,transparent 35%),
        radial-gradient(circle at 85% 80%,#087d7430,transparent 35%),
        #07111f;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 15px;
}

.wrapper{
    width:100%;
    max-width:440px;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo-icon{
    width:62px;
    height:62px;
    margin:0 auto 12px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#08a88e,#19d6b5);
    font-size:30px;
    box-shadow:0 8px 25px #00b89445;
}

.logo h1{
    margin:0;
    font-size:25px;
    letter-spacing:.5px;
}

.logo p{
    margin:7px 0 0;
    color:#8fa4b9;
    font-size:13px;
}

.card{
    background:linear-gradient(145deg,#10263c,#0b1726);
    border:1px solid #ffffff12;
    border-radius:24px;
    padding:30px 25px;
    box-shadow:0 20px 55px #0008;
}

.card h2{
    margin:0 0 7px;
    text-align:center;
    font-size:25px;
}

.subtitle{
    text-align:center;
    color:#8fa4b9;
    font-size:13px;
    margin-bottom:25px;
}

.field{
    margin-bottom:17px;
}

label{
    display:block;
    color:#c7d6e4;
    font-size:13px;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px 14px;
    border-radius:11px;
    border:1px solid #ffffff15;
    outline:none;
    background:#071522;
    color:#fff;
    font-size:14px;
}

input::placeholder{
    color:#61758a;
}

input:focus{
    border-color:#20d6b4;
    box-shadow:0 0 0 3px #20d6b415;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:55px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:0;
    color:#7f95aa;
    cursor:pointer;
    font-size:12px;
}

.options{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:5px 0 20px;
}

.remember{
    display:flex;
    align-items:center;
    gap:7px;
    color:#8fa4b9;
    font-size:12px;
}

.remember input{
    width:auto;
    accent-color:#19d6b5;
}

.forgot{
    color:#20d6b4;
    text-decoration:none;
    font-size:12px;
    cursor:pointer;
}

.forgot:hover{
    text-decoration:underline;
}

.login-btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    background:linear-gradient(135deg,#08a88e,#19d6b5);
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 22px #00b89435;
}

.login-btn:hover{
    filter:brightness(1.08);
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#message{
    text-align:center;
    margin-top:15px;
    min-height:18px;
    font-size:13px;
    font-weight:600;
}

.register{
    text-align:center;
    margin-top:20px;
    color:#8fa4b9;
    font-size:13px;
}

.register a{
    color:#20d6b4;
    text-decoration:none;
    font-weight:700;
}

.register a:hover{
    text-decoration:underline;
}

.footer{
    text-align:center;
    color:#5f7488;
    font-size:11px;
    margin-top:20px;
}

@media(max-width:480px){
    body{
        padding:18px 12px;
    }

    .card{
        padding:25px 18px;
        border-radius:20px;
    }

    .logo h1{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="logo">
        <div class="logo-icon">🕌</div>

        <h1>AL BARAKAH</h1>

        <p>Welcome back</p>
    </div>

    <div class="card">

        <h2>Login</h2>

        <div class="subtitle">
            Sign in to your account
        </div>

        <form id="loginForm">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>

            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        id="showPasswordBtn">

                        Show

                    </button>

                </div>

            </div>

            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember">

                    Remember me

                </label>

                <a
                    href="#"
                    class="forgot"
                    id="forgotBtn">

                    Forgot Password?

                </a>

            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn">

                Login

            </button>

            <div id="message"></div>

        </form>

        <div class="register">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>

    <div class="footer">
        © 2026 Al Barakah
    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =========================
   YOUR FIREBASE PROJECT
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyB2MHb9fcWipUxDM6hF3Hgvy9ZsBHV0g",

    authDomain:
        "referpro-65d27.firebaseapp.com",

    databaseURL:
        "https://referpro-65d27-default-rtdb.firebaseio.com",

    projectId:
        "referpro-65d27",

    storageBucket:
        "referpro-65d27.firebasestorage.app",

    messagingSenderId:
        "257409426857",

    appId:
        "1:257409426857:web:8cfcdf79eab219d6f890b8"
};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =========================
   ADMIN EMAIL
========================= */

const ADMIN_EMAIL =
    "hanandanger7810@gmail.com";


/* =========================
   ELEMENTS
========================= */

const form =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");

const loginBtn =
    document.getElementById("loginBtn");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const rememberInput =
    document.getElementById("remember");

const showPasswordBtn =
    document.getElementById("showPasswordBtn");

const forgotBtn =
    document.getElementById("forgotBtn");


/* =========================
   SHOW / HIDE PASSWORD
========================= */

showPasswordBtn.addEventListener(
    "click",
    ()=>{

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            showPasswordBtn.innerText =
                "Hide";

        }else{

            passwordInput.type =
                "password";

            showPasswordBtn.innerText =
                "Show";

        }

    }
);


/* =========================
   LOGIN
========================= */

form.addEventListener(
    "submit",
    async(event)=>{

        event.preventDefault();

        const email =
            emailInput.value
            .trim()
            .toLowerCase();

        const password =
            passwordInput.value;

        const remember =
            rememberInput.checked;


        if(!email || !password){

            showMessage(
                "Please enter your email and password.",
                "error"
            );

            return;
        }


        loginBtn.disabled =
            true;

        loginBtn.innerText =
            "Logging in...";


        try{

            await setPersistence(
                auth,
                remember
                    ? browserLocalPersistence
                    : browserSessionPersistence
            );


            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                result.user;


            showMessage(
                "Login successful ✓",
                "success"
            );


            setTimeout(()=>{

                if(
                    user.email &&
                    user.email
                    .toLowerCase() ===
                    ADMIN_EMAIL
                    .toLowerCase()
                ){

                    window.location.href =
                        "admin.html";

                }else{

                    window.location.href =
                        "dashboard.html";

                }

            },700);


        }catch(error){

            console.error(
                "Firebase Login Error:",
                error
            );


            let text =
                "Login failed. Please try again.";


            switch(error.code){

                case
                "auth/invalid-credential":

                    text =
                        "Invalid email or password.";

                    break;


                case
                "auth/user-not-found":

                    text =
                        "No account found with this email.";

                    break;


                case
                "auth/wrong-password":

                    text =
                        "Incorrect password.";

                    break;


                case
                "auth/invalid-email":

                    text =
                        "Please enter a valid email.";

                    break;


                case
                "auth/too-many-requests":

                    text =
                        "Too many attempts. Try again later.";

                    break;


                case
                "auth/network-request-failed":

                    text =
                        "Network error. Check your internet.";

                    break;


                case
                "auth/user-disabled":

                    text =
                        "This account has been disabled.";

                    break;


                default:

                    text =
                        error.message ||
                        "Login failed.";

            }


            showMessage(
                text,
                "error"
            );


            loginBtn.disabled =
                false;

            loginBtn.innerText =
                "Login";

        }

    }
);


/* =========================
   FORGOT PASSWORD
========================= */

forgotBtn.addEventListener(
    "click",
    async(event)=>{

        event.preventDefault();


        const email =
            emailInput.value
            .trim()
            .toLowerCase();


        if(!email){

            showMessage(
                "Enter your email first.",
                "warning"
            );

            emailInput.focus();

            return;
        }


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );


            showMessage(
                "Password reset email sent ✓",
                "success"
            );


        }catch(error){

            console.error(error);


            let text =
                "Could not send reset email.";


            if(
                error.code ===
                "auth/user-not-found"
            ){

                text =
                    "No account found with this email.";

            }
            else if(
                error.code ===
                "auth/invalid-email"
            ){

                text =
                    "Please enter a valid email.";

            }


            showMessage(
                text,
                "error"
            );

        }

    }
);


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type
){

    message.innerText =
        text;


    if(type === "error"){

        message.style.color =
            "#ff6b6b";

    }
    else if(type === "warning"){

        message.style.color =
            "#ffcc66";

    }
    else{

        message.style.color =
            "#20d6b4";

    }

}

</script>

</body>
</html>
```
